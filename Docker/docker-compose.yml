services:
  api:
    build:
      context: ..
      dockerfile: Backend/Dockerfile
    container_name: daretodance-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=daretodance;Username=daretodance;Password=daretodance;Include Error Detail=true
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      JwtSettings__Secret: dev-only-local-jwt-signing-secret-do-not-use-in-production-1234567890
      OtpSettings__Pepper: dev-only-local-otp-pepper-do-not-use-in-production-1234567890
      GoogleAuth__ClientId: 861559944635-o2kuqqtnr3qv92ggkjhp8108k78olkkh.apps.googleusercontent.com
      NotificationService__GrpcAddress: http://notification:8080
    ports:
      - "5015:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  notification:
    build:
      context: ..
      dockerfile: NotificationService/Dockerfile
    container_name: daretodance-notification
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      EmailSettings__GmailAddress: dev-only-placeholder@gmail.com
      EmailSettings__AppPassword: dev-only-placeholder-app-password
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: daretodance
      RabbitMq__Password: daretodance
    ports:
      - "5017:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    container_name: daretodance-postgres
    environment:
      POSTGRES_USER: daretodance
      POSTGRES_PASSWORD: daretodance
      POSTGRES_DB: daretodance
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U daretodance -d daretodance" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: daretodance-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: daretodance
      RABBITMQ_DEFAULT_PASS: daretodance
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: ../Frontend/Web
      dockerfile: Dockerfile
    container_name: daretodance-web
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: daretodance-aspire-dashboard
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"
      - "4317:18889"
    restart: unless-stopped

volumes:
  postgres-data:
    name: backend_postgres-data
    external: true
  rabbitmq-data:
